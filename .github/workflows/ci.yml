name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]  # Run on all PRs from any branch

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.1'  # Match your go.mod version
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: v1.57.2
    
    - name: Run tests
      run: make test
    
    - name: Build
      run: make build
